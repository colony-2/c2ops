name: test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            */go.sum
            */*/go.sum

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: "12.10.1"

      - name: Configure declared CLI installs
        run: echo "PNPM_CONFIG_ALLOW_BUILDS=$(jq -c . nix/pnpm-build-policy.json)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: |
            */main.py
      - name: Check packaged manifests
        run: make check-manifests
      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            allow-import-from-derivation = false

      - name: Require publishing configuration on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_COLONY2_AUTHKEY }}
        run: |
          test -n "$CACHIX_AUTH_TOKEN" || { echo 'Set the CACHIX_COLONY2_AUTHKEY repository secret'; exit 1; }

      - name: Record package selectors and store paths
        id: packages
        env:
          NIX_SYSTEM: ${{ matrix.system }}
        run: python3 scripts/publication.py record --system "$NIX_SYSTEM" --revision "$GITHUB_SHA"

      - name: Configure Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE || 'colony2' }}
          skipPush: true

      - name: Check metadata without building
        run: nix flake check --no-build --all-systems

      - name: Configure authorized private source access
        run: |
          go env -w GOPRIVATE=github.com/colony-2/*
          # Store only a helper program, never the token or a token-bearing URL.
          # Each authorized step supplies the token through its environment.
          git config --global credential.https://github.com.helper \
            '!f() { if test "$1" = get && test -n "$C2OPS_GIT_TOKEN"; then printf "username=x-access-token\npassword=%s\n" "$C2OPS_GIT_TOKEN"; fi; }; f'

      - name: Prefetch content-pinned private act source
        env:
          C2OPS_GIT_TOKEN: ${{ secrets.READ_ALL_C2_REPOS }}
        run: python3 scripts/prefetch-act.py

      - name: Build packages and check installed process contracts
        run: nix flake check -L

      - name: Run tests
        env:
          C2OPS_GIT_TOKEN: ${{ secrets.READ_ALL_C2_REPOS }}
          UV_NO_MANAGED_PYTHON: "1"
          C2OPS_TEST_FLAKE: path:${{ github.workspace }}
          C2OPS_TEST_NIX_PUBLICATION: "1"
          C2OPS_TEST_GHA_ACTIONS: "1"
        run: make test OP_DIRS="$(make ops | sed '/^gha$/d')"

      - name: Run GHA tests with its compiler minimum
        env:
          C2OPS_GIT_TOKEN: ${{ secrets.READ_ALL_C2_REPOS }}
          GOTOOLCHAIN: go1.26.10
          C2OPS_TEST_FLAKE: path:${{ github.workspace }}
          C2OPS_TEST_GHA_ACTIONS: "1"
        run: make -C gha test

      - name: Check native Codex in the minimal worker image
        if: runner.os == 'Linux'
        env:
          C2OPS_TEST_FLAKE: path:${{ github.workspace }}
        run: python3 scripts/check-codex-worker.py

      - uses: actions/upload-artifact@v4
        with:
          name: nix-packages-${{ matrix.system }}
          path: packages.json

      - name: Publish tested packages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE || 'colony2' }}
          authToken: ${{ secrets.CACHIX_COLONY2_AUTHKEY }}
          skipAddingSubstituter: true
          pathsToPush: ${{ steps.packages.outputs.paths }}

  # needs waits for all platforms, including Cachix's post-job uploads.
  verify:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    env:
      NIX_SYSTEM: ${{ matrix.system }}
      CACHIX_CACHE: ${{ vars.CACHIX_CACHE || 'colony2' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: nix-packages-${{ matrix.system }}
      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          skipPush: true
      - name: Verify complete downloads into an empty store with builds disabled
        run: >-
          python3 scripts/publication.py verify
          --system "$NIX_SYSTEM" --revision "$GITHUB_SHA"
          --store "$RUNNER_TEMP/c2ops-publication-store" --cache "$CACHIX_CACHE"
      - name: Retain verified op closures and their CLI dependencies
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_COLONY2_AUTHKEY }}
        run: >-
          python3 scripts/publication.py pin
          --system "$NIX_SYSTEM" --revision "$GITHUB_SHA"
          --store "$RUNNER_TEMP/c2ops-publication-store" --cache "$CACHIX_CACHE"

  promote:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: c2ops-published
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Advance published to the exact verified commit
        run: python3 scripts/promote-published.py "$GITHUB_SHA"
