name: test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            */go.sum

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: |
            */main.py

      - name: Warm uv script environments
        env:
          UV_NO_MANAGED_PYTHON: "1"
        run: make install-test-deps

      - name: Run tests
        env:
          C2OPS_USE_SYSTEM_UV: "1"
          UV_NO_MANAGED_PYTHON: "1"
          UV_OFFLINE: "1"
        run: make test
