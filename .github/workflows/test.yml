name: test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            */go.sum

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Codex CLI
        run: |
          npm install -g @openai/codex@0.157.1
          codex --version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: |
            */main.py
      - name: Check packaged manifests
        run: make check-manifests
      - name: Warm uv script environments
        env:
          UV_NO_MANAGED_PYTHON: "1"
        run: make install-test-deps
      - name: Configure Git and Go for Private Modules
        run: |
          # 1. Tell Go not to use the public proxy/checksum DB for your org
          go env -w GOPRIVATE=github.com/colony-2/*
          
          # 2. Force Git to use your PAT for HTTPS requests to GitHub
          git config --global url."https://x-access-token:${{ secrets.READ_ALL_C2_REPOS }}@github.com/".insteadOf "https://github.com/"
      - name: Run tests
        env:
          C2OPS_USE_SYSTEM_UV: "1"
          UV_NO_MANAGED_PYTHON: "1"
          UV_OFFLINE: "1"
        run: make test

  nix:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            allow-import-from-derivation = false

      - name: Require publishing configuration on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_COLONY2_AUTHKEY }}
        run: |
          test -n "$CACHIX_AUTH_TOKEN" || { echo 'Set the CACHIX_COLONY2_AUTHKEY repository secret'; exit 1; }

      - name: Record package selectors and store paths
        id: packages
        env:
          NIX_SYSTEM: ${{ matrix.system }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          system = os.environ['NIX_SYSTEM']
          revision = os.environ['GITHUB_SHA']
          packages = {}
          for name in json.loads(Path('nix/ops.json').read_text()):
              path = subprocess.check_output([
                  'nix', 'eval', '--raw', f'.#packages.{system}.{name}.outPath'
              ], text=True)
              packages[name] = {
                  'selector': f'nix:github:colony-2/c2ops/{revision}#{name}',
                  'store_path': path,
              }
          Path('packages.json').write_text(json.dumps({
              'revision': revision, 'system': system, 'packages': packages
          }, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('paths=' + ' '.join(p['store_path'] for p in packages.values()) + '\n')
          PY

      - name: Configure Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE || 'colony2' }}
          authToken: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.CACHIX_COLONY2_AUTHKEY || '' }}
          pathsToPush: ${{ steps.packages.outputs.paths }}
          skipPush: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

      - name: Check metadata without building
        run: nix flake check --no-build --all-systems

      - name: Build packages and check installed process contracts
        run: nix flake check -L

      - uses: actions/upload-artifact@v4
        with:
          name: nix-packages-${{ matrix.system }}
          path: packages.json
