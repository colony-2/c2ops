name: rule_gate
description: Evaluate deterministic recipe policy rules
command: ["go", "run", "."]
timeout: 2m
dependencies:
  - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#go
input_schema:
  type: object
  required: [rules]
  properties:
    artifact_inbox_path:
      type: string
      default: "{{ context.environment.op.inbox }}"
    artifact_outbox_path:
      type: string
      default: "{{ context.environment.op.outbox }}"
    worktree_path:
      type: string
      default: "{{ context.environment.op.worktree_path }}"
    rules:
      type: array
      minItems: 1
      items:
        type: object
        required: [id, type, message]
        properties:
          id:
            type: string
            minLength: 1
          type:
            type: string
            enum:
              - assert
              - artifact_exists
              - file_exists
              - json_parse
              - json_schema
              - child_status
          message:
            type: string
            minLength: 1
          value:
            type: boolean
          artifact: {}
          path:
            type: string
            minLength: 1
          inbox_path:
            type: string
            minLength: 1
          schema:
            type: object
          schema_worktree_path:
            type: string
            minLength: 1
          schema_inbox_path:
            type: string
            minLength: 1
          status: {}
          allow_statuses:
            type: array
            items:
              type: string
              minLength: 1
output_schema:
  type: object
  required:
    - version
    - ok
    - failed_rule_ids
    - summary
    - results
  properties:
    version:
      type: string
    ok:
      type: boolean
    failed_rule_ids:
      type: array
      uniqueItems: true
      items:
        type: string
        minLength: 1
    summary:
      type: object
      required: [total, passed, failed]
      properties:
        total:
          type: integer
        passed:
          type: integer
        failed:
          type: integer
    results:
      type: object
      additionalProperties:
        type: object
        required: [id, type, status, message]
        properties:
          id:
            type: string
          type:
            type: string
          status:
            type: string
            enum: [failed]
          message:
            type: string
          details:
            type: object
