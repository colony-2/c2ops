name: codex
description: Runs Codex via the selector-backed extension mechanism
command: ["go", "run", "."]
timeout: 30m
dependencies:
  - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#go
  - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#gitMinimal
  - nix:github:colony-2/c2ops/published#codex-cli
input_schema:
  type: object
  additionalProperties: false
  required: [prompt]
  properties:
    prompt:
      type: string
    session:
      type: object
      x-c2j-object-type: c2ops.codex.session/v1
    model:
      type: string
    api:
      type: object
      description: Optional external Responses API; credentials stay in the worker environment.
      additionalProperties: false
      required: [base_url]
      properties:
        base_url:
          type: string
          description: API base URL including any prefix such as /v1, without /responses.
        api_key_env:
          type: string
          description: Name of the environment variable containing the proxy access key (defaults to C2OPS_CODEX_API_KEY).
    env:
      type: object
      additionalProperties:
        type: string
    skills:
      type: array
      items:
        type: string
    return_on:
      type: array
      items:
        type: string
    status_contract:
      type: object
    idle_timeout:
      type: string
      default: 5m
    workdir_path:
      type: string
      default: "{{ context.environment.op.workdir }}"
    worktree_path:
      type: string
      default: "{{ context.environment.op.worktree_path }}"
    artifact_inbox_path:
      type: string
      default: "{{ context.environment.op.inbox }}"
    artifact_outbox_path:
      type: string
      default: "{{ context.environment.op.outbox }}"
output_schema:
  type: object
  required: [session]
  properties:
    session:
      type: object
      x-c2j-object-type: c2ops.codex.session/v1
    status:
      type: string
    sessionId:
      type: string
    assistantSummary:
      type: string
    incompleteReason:
      type: string
    incompleteCategory:
      type: string
    pendingDependencies:
      type: array
      items:
        type: object
    skills_installed:
      type: array
      items:
        type: string
    outcome:
      type: object
