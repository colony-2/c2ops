id: codex-inbox-git-outbox
version: "1.0.0"
desc: Verify codex.exec reads inbox artifacts, persists git changes, and emits outbox artifacts
input_schema: {}
sequence:
  - id: write_seed_artifact
    op: command_execution
    inputs:
      working_directory: "{{ context.environment.op.outbox }}"
      run: "printf 'fixture-token' > input.txt"

  - id: codex_apply
    op: ./codex
    artifacts:
      input.txt: '${{ sequence.write_seed_artifact.artifacts["input.txt"] }}'
    inputs:
      workdir_path: "{{ context.environment.op.workdir }}"
      worktree_path: "{{ context.environment.op.worktree_path }}"
      artifact_inbox_path: "{{ context.environment.op.inbox }}"
      artifact_outbox_path: "{{ context.environment.op.outbox }}"
      prompt: |
        Run this exact shell command and do not alter it:
        bash -lc 'set -euo pipefail; token=$(cat "{{ context.environment.op.inbox }}/input.txt"); printf "from_inbox=%s" "$token" > codex-fixture.txt; printf "outbox_from_inbox=%s" "$token" > "{{ context.environment.op.outbox }}/codex-generated.txt"; test -s codex-fixture.txt; test -s "{{ context.environment.op.outbox }}/codex-generated.txt"'
        After running it, provide your normal structured response.

  - id: read_git_file
    op: command_execution
    inputs:
      working_directory: "{{ context.environment.op.worktree_path }}"
      run: |
        if [ -f "codex-fixture.txt" ]; then
          cat "codex-fixture.txt"
        else
          echo "__MISSING_GIT_FILE__"
        fi

outputs:
  codex_status: "{{ sequence.codex_apply.outputs.status }}"
  git_content: "{{ sequence.read_git_file.outputs.stdout }}"
