{
  "name": "github.release",
  "description": "Create safe source tags and publish complete byte-verified GitHub releases",
  "command": [
    "nix",
    "run",
    "github:colony-2/c2ops/published#github-release",
    "--"
  ],
  "dependencies": [
    "nix:github:colony-2/c2ops/published#github-release"
  ],
  "input_schema": {
    "$schema": "https://json-schema.org/draft/2020-12/schema",
    "type": "object",
    "required": [
      "intent",
      "files",
      "provenance",
      "workspace_root",
      "inbox_root",
      "outbox_root"
    ],
    "additionalProperties": false,
    "properties": {
      "intent": {
        "$ref": "#/$defs/intent"
      },
      "files": {
        "type": "array",
        "minItems": 2,
        "items": {
          "$ref": "#/$defs/file"
        },
        "maxItems": 100
      },
      "provenance": {
        "$ref": "#/$defs/provenance"
      },
      "workspace_root": {
        "type": "string",
        "minLength": 1,
        "default": "{{ context.environment.op.worktree_path }}"
      },
      "inbox_root": {
        "type": "string",
        "minLength": 1,
        "default": "{{ context.environment.op.inbox }}"
      },
      "outbox_root": {
        "type": "string",
        "minLength": 1,
        "default": "{{ context.environment.op.outbox }}"
      }
    },
    "$defs": {
      "intent": {
        "type": "object",
        "required": [
          "schema_version",
          "release_id",
          "repository",
          "source_commit",
          "version",
          "tag",
          "target_branch",
          "build_date",
          "binary_name"
        ],
        "properties": {
          "schema_version": {
            "const": 1
          },
          "release_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "repository": {
            "type": "string",
            "pattern": "^github\\.com/[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9][A-Za-z0-9._-]*$",
            "maxLength": 160
          },
          "source_commit": {
            "type": "string",
            "pattern": "^([0-9a-f]{40}|[0-9a-f]{64})$"
          },
          "version": {
            "type": "string",
            "minLength": 1,
            "pattern": "^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$",
            "maxLength": 128
          },
          "tag": {
            "type": "string",
            "pattern": "^v[^\\s]+$"
          },
          "target_branch": {
            "type": "string",
            "minLength": 1
          },
          "build_date": {
            "type": "string",
            "format": "date-time",
            "pattern": "Z$"
          },
          "binary_name": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$",
            "maxLength": 200
          }
        },
        "additionalProperties": false
      },
      "file": {
        "type": "object",
        "required": [
          "schema_version",
          "release_id",
          "repository",
          "source_commit",
          "version",
          "tag",
          "name",
          "size",
          "sha256",
          "kind"
        ],
        "properties": {
          "schema_version": {
            "const": 1
          },
          "release_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "repository": {
            "type": "string",
            "pattern": "^github\\.com/[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9][A-Za-z0-9._-]*$",
            "maxLength": 160
          },
          "source_commit": {
            "type": "string",
            "pattern": "^([0-9a-f]{40}|[0-9a-f]{64})$"
          },
          "version": {
            "type": "string",
            "minLength": 1,
            "pattern": "^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$",
            "maxLength": 128
          },
          "tag": {
            "type": "string",
            "pattern": "^v[^\\s]+$"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 1000,
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
          },
          "size": {
            "type": "integer",
            "minimum": 0,
            "maximum": 1099511627776
          },
          "sha256": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "kind": {
            "enum": [
              "archive",
              "checksums",
              "document"
            ]
          },
          "goos": {
            "enum": [
              "linux",
              "darwin"
            ]
          },
          "goarch": {
            "enum": [
              "amd64",
              "arm64"
            ]
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "kind": {
                  "const": "archive"
                }
              }
            },
            "then": {
              "required": [
                "goos",
                "goarch"
              ]
            }
          }
        ],
        "additionalProperties": false
      },
      "provenance": {
        "type": "object",
        "required": [
          "schema_version",
          "release_id",
          "repository",
          "source_commit",
          "version",
          "tag",
          "source_tree",
          "source_materialization"
        ],
        "properties": {
          "schema_version": {
            "const": 1
          },
          "release_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "repository": {
            "type": "string",
            "pattern": "^github\\.com/[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9][A-Za-z0-9._-]*$",
            "maxLength": 160
          },
          "source_commit": {
            "type": "string",
            "pattern": "^([0-9a-f]{40}|[0-9a-f]{64})$"
          },
          "version": {
            "type": "string",
            "minLength": 1,
            "pattern": "^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$",
            "maxLength": 128
          },
          "tag": {
            "type": "string",
            "pattern": "^v[^\\s]+$"
          },
          "source_tree": {
            "type": "string",
            "pattern": "^([0-9a-f]{40}|[0-9a-f]{64})$"
          },
          "source_materialization": {
            "const": "git-tree-verified"
          }
        }
      }
    }
  },
  "output_schema": {
    "$schema": "https://json-schema.org/draft/2020-12/schema",
    "title": "github.release output v1",
    "type": "object",
    "required": [
      "intent",
      "files",
      "provenance",
      "release"
    ],
    "properties": {
      "intent": {
        "$ref": "#/$defs/intent"
      },
      "files": {
        "type": "array",
        "minItems": 2,
        "items": {
          "$ref": "#/$defs/file"
        },
        "maxItems": 100
      },
      "provenance": {
        "$ref": "#/$defs/provenance"
      },
      "release": {
        "$ref": "#/$defs/release"
      }
    },
