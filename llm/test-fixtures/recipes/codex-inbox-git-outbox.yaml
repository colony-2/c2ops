id: codex-inbox-git-outbox
version: "1.0.0"
desc: Verify codex.exec reads inbox artifacts, persists git changes, and emits outbox artifacts
input_schema: {}
sequence:
  - id: write_seed_artifact
    op: command_execution
    inputs:
      working_directory: "{{ context.environment.outbox }}"
      run: "printf 'fixture-token' > input.txt"

  - id: codex_apply
    op: ./server/llm/pkg/codex/extension-codex-exec
    artifacts:
      input.txt: '${{ sequence.write_seed_artifact.artifacts["input.txt"] }}'
    inputs:
      workdir_path: "{{ context.environment.workdir }}"
      worktree_path: "{{ context.environment.worktree_path }}"
      artifact_inbox_path: "{{ context.environment.inbox }}"
      artifact_outbox_path: "{{ context.environment.outbox }}"
      cell_relative_path: >-
        ${{
          (has(context.workflow.cell_path) && context.workflow.cell_path != "")
            ? context.workflow.cell_path
            : "."
        }}
      prompt: |
        Run this exact shell command and do not alter it:
        bash -lc 'set -euo pipefail; token=$(cat "../inbox/input.txt"); mkdir -p "{{ context.workflow.cell_path }}"; printf "from_inbox=%s" "$token" > "{{ context.workflow.cell_path }}/codex-fixture.txt"; printf "outbox_from_inbox=%s" "$token" > "../outbox/codex-generated.txt"; test -s "{{ context.workflow.cell_path }}/codex-fixture.txt"; test -s "../outbox/codex-generated.txt"'
        After running it, provide your normal structured response.

  - id: read_git_file
    op: command_execution
    inputs:
      run: |
        if [ -f "{{ context.workflow.cell_path }}/codex-fixture.txt" ]; then
          cat "{{ context.workflow.cell_path }}/codex-fixture.txt"
        else
          echo "__MISSING_GIT_FILE__"
        fi

outputs:
  codex_status: "{{ sequence.codex_apply.outputs.status }}"
  git_content: "{{ sequence.read_git_file.outputs.stdout }}"
