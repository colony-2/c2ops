name: llm
description: Runs the legacy llm_inference Go implementation through the extension mechanism
command: ["nix", "run", "github:colony-2/c2ops/published#llm", "--"]
dependencies:
  - nix:github:colony-2/c2ops/published#llm
input_schema:
  type: object
  required: [provider, model, prompt]
  properties:
    provider:
      type: string
    model:
      type: string
    prompt:
      type: string
    system_prompt:
      type: string
    temperature:
      type: number
    max_tokens:
      type: integer
    top_p:
      type: number
    stop_sequences:
      type: array
      items:
        type: string
    response_schema: {}
output_schema:
  type: object
  properties:
    response: {}
    model:
      type: string
    finish_reason:
      type: string
    usage:
      type: object
