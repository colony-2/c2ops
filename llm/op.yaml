name: llm
description: Runs the legacy llm_inference Go implementation through the extension mechanism
command: ["go", "run", "."]
timeout: 5m
dependencies:
  - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#go
  - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#gitMinimal
input_schema:
  type: object
  required: [provider, model, prompt]
  properties:
    provider:
      type: string
    model:
      type: string
    prompt:
      type: string
    system_prompt:
      type: string
    temperature:
      type: number
    max_tokens:
      type: integer
    top_p:
      type: number
    stop_sequences:
      type: array
      items:
        type: string
    response_schema: {}
output_schema:
  type: object
  properties:
    response: {}
    model:
      type: string
    finish_reason:
      type: string
    usage:
      type: object
