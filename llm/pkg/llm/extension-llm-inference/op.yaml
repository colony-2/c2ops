name: llm_inference
description: Runs the legacy llm_inference Go implementation through the extension mechanism
working_directory: .
command: ["go", "run", "./server/llm/cmd/llm-inference-op"]
timeout: 5m
input_schema:
  type: object
  required: [provider, model, prompt]
  properties:
    provider:
      type: string
    model:
      type: string
    prompt:
      type: string
    system_prompt:
      type: string
    temperature:
      type: number
    max_tokens:
      type: integer
    top_p:
      type: number
    stop_sequences:
      type: array
      items:
        type: string
    response_schema:
      type: object
output_schema:
  type: object
  properties:
    response: {}
    model:
      type: string
    finish_reason:
      type: string
    usage:
      type: object
