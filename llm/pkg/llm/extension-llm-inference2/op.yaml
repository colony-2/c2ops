name: llm_inference2
description: Runs the enhanced llm_inference2 Go implementation through the extension mechanism
working_directory: .
command: ["go", "run", "./server/llm/cmd/llm-inference2-op"]
timeout: 5m
input_schema:
  type: object
  required: [default_provider, default_model]
  properties:
    default_provider:
      type: string
    default_model:
      type: string
    prompt:
      type: string
    system_prompt:
      type: string
    files:
      type: array
      items:
        type: object
    tools:
      type: array
      items:
        type: object
    execute_tools:
      type: boolean
    response_schema:
      type: object
output_schema:
  type: object
  properties:
    response:
      type: string
    model:
      type: string
    finish_reason:
      type: string
    usage:
      type: object
    tool_calls:
      type: array
      items:
        type: object
    tool_results:
      type: array
      items:
        type: object
    files_written:
      type: array
      items:
        type: string
    files_read:
      type: array
      items:
        type: string
    files_deleted:
      type: array
      items:
        type: string
