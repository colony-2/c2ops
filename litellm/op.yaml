name: litellm
description: Runs llm_inference-compatible requests through LiteLLM via uv
command: ["uv", "run", "--script", "./main.py"]
timeout: 5m
dependencies:
  - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#python313
  - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#uv
env:
  PYTHONUNBUFFERED: "1"
input_schema:
  type: object
  required: [provider, model, prompt]
  properties:
    provider:
      type: string
    model:
      type: string
    prompt:
      type: string
    system_prompt:
      type: string
    temperature:
      type: number
    max_tokens:
      type: integer
    top_p:
      type: number
    stop_sequences:
      type: array
      items:
        type: string
    response_schema: {}
output_schema:
  type: object
  properties:
    response: {}
    model:
      type: string
    finish_reason:
      type: string
    usage:
      type: object
