id: verify-platform
input_schema:
  candidate: {type: string, required: true}
  base: {type: string, required: true}
  system: {type: string, required: true}
  worker_base: {type: string, required: true}
  target_directory: {type: string, required: true}
  package_job: {type: string}
  settings: {type: artifact}
  prompt: {type: string}
  title: {type: string}
  type: {type: string}
perms:
  jobdb:
    secrets: {resolve: [gitvend_base_token]}
inputs:
  candidate: ${{ inputs.candidate }}
  base: ${{ inputs.base }}
  system: ${{ inputs.system }}
  worker_base: ${{ inputs.worker_base }}
  target_directory: ${{ inputs.target_directory }}
  settings: ${{ inputs.?settings.orValue(null) }}
  package_job: ${{ inputs.?package_job.orValue('') }}
sequence:
- id: packages
  when: inputs.package_job == ''
  include: ./packages.yaml
  inputs:
    system: ${{ inputs.system }}
    candidate: ${{ inputs.candidate }}
    worker_base: ${{ inputs.worker_base }}
- id: tests
  include: ./native.yaml
  inputs:
    worker_base: ${{ inputs.worker_base }}
    target_directory: ${{ inputs.target_directory }}
    settings: ${{ inputs.settings }}
    candidate: ${{ inputs.candidate }}
    base: ${{ inputs.base }}
- id: await_packages
  when: inputs.package_job != ''
  op: recipe.await_result
  const: true
  workspace: {cell: '${{ context.workflow.cell }}', initial: empty}
  inputs:
    target: {job: '${{ inputs.package_job }}'}
    wait: {'on': job, condition: success}
  expect_outputs:
    type: object
    required: [outputs]
    properties:
      outputs: {type: object, required: [success], properties: {success: {enum: [true]}}}
outputs:
  status: ${{ sequence.tests.outputs.status }}
  artifact_refs: ${{ sequence.tests.outputs.artifact_refs }}
