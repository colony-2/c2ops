id: c2ops-verify
inputs:
  candidate: ${{ inputs.candidate }}
  base: ${{ inputs.base }}
  settings: ${{ inputs.?settings.orValue(null) }}
  target_directory: ${{ inputs.target_directory }}
sequence:
- id: mac
  include: ./verify/platform.yaml
  inputs:
    system: aarch64-darwin
    worker_base: 'macos*'
    candidate: ${{ inputs.candidate }}
    base: ${{ inputs.base }}
    settings: ${{ inputs.settings }}
    target_directory: ${{ inputs.target_directory }}
- id: amd
  include: ./verify/platform.yaml
  inputs:
    system: x86_64-linux
    worker_base: 'ubuntu*amd64'
    candidate: ${{ inputs.candidate }}
    base: ${{ inputs.base }}
    settings: ${{ inputs.settings }}
    target_directory: ${{ inputs.target_directory }}
- id: arm
  include: ./verify/platform.yaml
  inputs:
    system: aarch64-linux
    worker_base: 'ubuntu*arm64'
    candidate: ${{ inputs.candidate }}
    base: ${{ inputs.base }}
    settings: ${{ inputs.settings }}
    target_directory: ${{ inputs.target_directory }}
outputs:
  api_version: c2.build-hook/v1
  status: "${{ [sequence.mac, sequence.amd, sequence.arm].all(p, p.outputs.status == 'passed') ? 'passed' : 'failed' }}"
  summary: >-
    Native verification completed. Apple silicon ${{ sequence.mac.outputs.status }},
    Linux amd64 ${{ sequence.amd.outputs.status }}, Linux arm64 ${{ sequence.arm.outputs.status }}.
  artifact_refs:
    aarch64-darwin/verification.md: ${{ sequence.mac.outputs.artifact_refs['verification.md'] }}
    aarch64-darwin/verification.json: ${{ sequence.mac.outputs.artifact_refs['verification.json'] }}
    aarch64-darwin/evidence.tar.gz: ${{ sequence.mac.outputs.artifact_refs['evidence.tar.gz'] }}
    x86_64-linux/verification.md: ${{ sequence.amd.outputs.artifact_refs['verification.md'] }}
    x86_64-linux/verification.json: ${{ sequence.amd.outputs.artifact_refs['verification.json'] }}
    x86_64-linux/evidence.tar.gz: ${{ sequence.amd.outputs.artifact_refs['evidence.tar.gz'] }}
    aarch64-linux/verification.md: ${{ sequence.arm.outputs.artifact_refs['verification.md'] }}
    aarch64-linux/verification.json: ${{ sequence.arm.outputs.artifact_refs['verification.json'] }}
    aarch64-linux/evidence.tar.gz: ${{ sequence.arm.outputs.artifact_refs['evidence.tar.gz'] }}
