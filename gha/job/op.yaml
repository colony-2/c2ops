name: gha-job
description: Executes one externally scheduled Actions job with act in the current worker environment (experimental)
command: ["nix", "run", "github:colony-2/c2ops/published#gha-job", "--"]
dependencies:
  - nix:github:colony-2/c2ops/published#gha-job
input_schema:
  type: object
  required: [workflow, job_id]
  properties:
    artifact_inputs:
      type: array
      items:
        type: object
        x-c2j-object-type: c2ops.gha.artifacts/v1
    payload:
      type: string
      description: Base64 public execution request supplied by the workflow coordinator
    workflow_sha256:
      type: string
    workflow:
      type: string
      description: Path to the workflow within the prepared worktree
    job_id:
      type: string
    needs:
      type: object
      additionalProperties:
        type: object
        required: [conclusion]
        properties:
          conclusion:
            type: string
            enum: [success, failure, cancelled, skipped]
          outputs:
            type: object
            additionalProperties: {type: string}
    matrix:
      type: object
    repository: {type: string}
    revision: {type: string}
    source_credential:
      type: string
      description: Explicit secret_bindings alias used only for authorized source history preparation
    event_name:
      type: string
      default: workflow_dispatch
    event:
      type: object
    env:
      type: object
      additionalProperties: {type: string}
    vars:
      type: object
      additionalProperties: {type: string}
    secrets:
      type: object
      additionalProperties:
        type: string
        x-secret: true
    worktree_path:
      type: string
      default: '{{ context.environment.op.worktree_path }}'
    runner_profiles:
      items:
        additionalProperties: false
        oneOf:
          - required:
              - execution_needs
          - required:
              - execution_required
          - required:
              - runner_type
        properties:
          execution_needs:
            type: object
          execution_required:
            additionalProperties: false
            minProperties: 1
            properties:
              base:
                minLength: 1
                type: string
              capabilities:
                items:
                  type: string
                type: array
              resources:
                additionalProperties: false
                properties:
                  cpu:
                    minLength: 1
                    type: string
                  ephemeral-storage:
                    minLength: 1
                    type: string
                  memory:
                    minLength: 1
                    type: string
                type: object
            type: object
          labels:
            items:
              type: string
            minItems: 1
            type: array
          runner_type:
            additionalProperties: false
            properties:
              architecture:
                type: string
              image:
                type: string
              size:
                type: string
            required:
              - image
              - architecture
              - size
            type: object
        required:
          - labels
        type: object
      type: array
    execution_mode:
      enum:
        - static
        - negotiate
      type: string
    execution_required:
      additionalProperties: false
      minProperties: 1
      properties:
        base:
          minLength: 1
          type: string
        capabilities:
          items:
            type: string
          type: array
        resources:
          additionalProperties: false
          properties:
            cpu:
              minLength: 1
              type: string
            ephemeral-storage:
              minLength: 1
              type: string
            memory:
              minLength: 1
              type: string
          type: object
      type: object
output_schema:
  type: object
  required: [job_id, conclusion, outputs, diagnostics]
  properties:
    job_id: {type: string}
    conclusion:
      type: string
      enum: [success, failure, cancelled, skipped]
    outputs:
      type: object
      additionalProperties: {type: string}
    artifacts:
      type: array
      items:
        type: object
        x-c2j-object-type: c2ops.gha.artifacts/v1
    diagnostics:
      type: object
      x-c2j-object-type: c2ops.gha.diagnostics/v1
