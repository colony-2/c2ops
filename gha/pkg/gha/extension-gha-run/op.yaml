name: gha.run
description: Runs the gha.run Go implementation through the extension mechanism
working_directory: .
command: ["go", "run", "./server/gha/cmd/gha-run-op"]
timeout: 30m
input_schema:
  type: object
  required: [workflow]
  properties:
    workflow:
      type: string
    with:
      type: object
    env:
      type: object
      additionalProperties:
        type: string
    secrets:
      type: object
      additionalProperties:
        type: string
    backend:
      type: string
    runner_image:
      type: string
    timeout:
      type: string
    continue_on_error:
      type: boolean
    remote:
      type: object
output_schema:
  type: object
  properties:
    status:
      type: string
    exit_code:
      type: integer
    duration_seconds:
      type: integer
    error_message:
      type: string
    workflow:
      type: object
    jobs:
      type: object
