name: gha.runs
description: Runs the gha.runs Go implementation through the extension mechanism
working_directory: .
command: ["go", "run", "./server/gha/cmd/gha-runs-op"]
timeout: 45m
input_schema:
  type: object
  required: [workflows]
  properties:
    workflows:
      type: array
      items:
        type: object
    timeout:
      type: string
    continue_on_error:
      type: boolean
output_schema:
  type: object
  properties:
    status:
      type: string
    all_passed:
      type: boolean
    error_message:
      type: string
    results:
      type: object
