name: gha-many
description: Runs the gha.runs Go implementation through the extension mechanism
command: ["go", "run", "."]
timeout: 45m
dependencies:
  - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#go
  - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#gitMinimal
  - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#docker-client
input_schema:
  type: object
  required: [workflows]
  properties:
    workflows:
      type: array
      items:
        type: object
        required: [workflow]
        properties:
          id:
            type: string
          workflow:
            type: string
          with:
            type: object
          env:
            type: object
            additionalProperties:
              type: string
          secrets:
            type: object
            additionalProperties:
              type: string
          backend:
            type: string
          runner_image:
            type: string
          container_architecture:
            type: string
          timeout:
            type: string
          continue_on_error:
            type: boolean
          remote:
            type: object
            properties:
              push_to:
                type: string
              ref_prefix:
                type: string
    timeout:
      type: string
    continue_on_error:
      type: boolean
    git_context:
      type: object
      default:
        base_repo: "{{ context.git.repo }}"
        base_ref: "{{ context.git.ref }}"
        resolved_base_hash: "{{ context.git.resolved_hash }}"
        persist_hash: "{{ context.git.hash }}"
        parent_hash: "{{ context.git.parent_hash }}"
        invoke_hash: "{{ context.invocation.hash }}"
        worktree_path: "{{ context.environment.op.worktree_path }}"
      properties:
        base_repo:
          type: string
          default: "{{ context.git.repo }}"
        base_ref:
          type: string
          default: "{{ context.git.ref }}"
        resolved_base_hash:
          type: string
          default: "{{ context.git.resolved_hash }}"
        persist_hash:
          type: string
          default: "{{ context.git.hash }}"
        parent_hash:
          type: string
          default: "{{ context.git.parent_hash }}"
        invoke_hash:
          type: string
          default: "{{ context.invocation.hash }}"
        worktree_path:
          type: string
          default: "{{ context.environment.op.worktree_path }}"
output_schema:
  type: object
  properties:
    status:
      type: string
    all_passed:
      type: boolean
    error_message:
      type: string
    results:
      type: object
