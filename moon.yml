$schema: "https://moonrepo.dev/schemas/project.json"
language: go
tags: ["backend", "go"]

tasks:
  integration:
    command: go test -v -tags=integration ./integration/...
    description: Run integration tests for all LLM adapters (requires API keys)
    env:
      TEST_TIMEOUT: "60s"
    options:
      outputStyle: buffer-only-failure
